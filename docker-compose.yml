services:
  nbclerp-frontend:
    image: ghcr.io/tarunsadhukhan/nbclerp3ui:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKENDHOST: http://nbclerp-backend:8000
        NEXT_PUBLIC_API_BASE_URL: /api
        USE_NEXT_PROXY: "true"
    container_name: nbclerp-frontend
    restart: unless-stopped
    # 3001 inside the container: package.json start is "next start -p 3001".
    # Host 3001 too, so nginx for nbcl.infoskyglobalit.in proxies to :3001.
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Kolkata
    networks:
      - nbclerp

networks:
  nbclerp:
    external: true
