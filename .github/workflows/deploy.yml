name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the bundle at BUILD time, so they must be
      # build-args here — setting them at runtime in compose would do nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Frontend and backend now live on SEPARATE VPS, so the old
          # docker-network hostname (http://nbclerp-backend:8000) no longer
          # resolves. This is consumed ONLY by next.config.ts rewrites(), which
          # run server-side inside the frontend container — the value is never
          # shipped to the browser, so the raw IP is safe and avoids depending
          # on DNS that isn't live yet. Swap to a hostname once DNS resolves.
          build-args: |
            NEXT_PUBLIC_BACKENDHOST=http://45.58.59.64:8001
            NEXT_PUBLIC_API_BASE_URL=/api
            USE_NEXT_PROXY=true
          # This label is what links the GHCR package to this repository.
          # Without it the package is standalone, and the repo-scoped
          # GITHUB_TOKEN can push but NOT pull it — the VPS then gets
          # "error from registry: denied" on docker compose pull.
          labels: |
            org.opencontainers.image.source=https://github.com/tarunsadhukhan/nbclnxtfront
          tags: |
            ghcr.io/tarunsadhukhan/nbclerp3ui:latest
            ghcr.io/tarunsadhukhan/nbclerp3ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/nbjcl/nbclerp3ui

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # set -e: without it a failed `docker compose pull` fell through to
            # `up -d`, which reported "Container nbclerp-frontend Running" for the
            # OLD image — the deploy silently no-op'd and only died on the prune.
            set -e
            # The /tmp/nbclerp-deploy.lock flock that used to be here guarded
            # against nbclerp3be's `docker image prune -f` deleting layers while
            # this job extracted them. Both repos shared one VPS then; they no
            # longer do (frontend 45.58.59.71, backend 45.58.59.64), so there is
            # nothing left to race against on this host.
            cd /opt/nbjcl/nbclerp3ui
            docker network inspect nbclerp >/dev/null 2>&1 || docker network create nbclerp
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
