name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the bundle at BUILD time, so they must be
      # build-args here — setting them at runtime in compose would do nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Frontend and backend share VPS 189.72.144.77 and the external
          # `nbclerp` docker network, so the backend is reached by container
          # name on its internal port. Consumed ONLY by next.config.ts
          # rewrites(), server-side inside the frontend container.
          build-args: |
            NEXT_PUBLIC_BACKENDHOST=http://nbclerp-backend:8000
            NEXT_PUBLIC_API_BASE_URL=/api
            USE_NEXT_PROXY=true
          # This label is what links the GHCR package to this repository.
          # Without it the package is standalone, and the repo-scoped
          # GITHUB_TOKEN can push but NOT pull it — the VPS then gets
          # "error from registry: denied" on docker compose pull.
          labels: |
            org.opencontainers.image.source=https://github.com/tarunsadhukhan/nbclnxtfront
          tags: |
            ghcr.io/tarunsadhukhan/nbclerp3ui:latest
            ghcr.io/tarunsadhukhan/nbclerp3ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/nbjcl/nbclerp3ui

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # set -e: without it a failed `docker compose pull` fell through to
            # `up -d`, which reported "Container nbclerp-frontend Running" for the
            # OLD image — the deploy silently no-op'd and only died on the prune.
            set -e
            # Frontend and backend share VPS 189.72.144.77, and both deploys end
            # in `docker image prune -f`. GitHub's `concurrency` group is
            # per-repo, so the other repo's prune can delete layers while THIS
            # job extracts them ("link <a> <b>: no such file or directory").
            # One lock file shared by both repos serialises them on the host.
            exec 9>/tmp/nbclerp-deploy.lock
            flock -w 900 9
            cd /opt/nbjcl/nbclerp3ui
            docker network inspect nbclerp >/dev/null 2>&1 || docker network create nbclerp
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
