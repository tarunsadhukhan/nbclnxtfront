# Frontend VPS 45.58.59.71 -> /etc/nginx/sites-available/nbjcl.punrasargroup.com.conf
#
# Proxies nbjcl.punrasargroup.com to the Next.js container published on :3001
# (compose maps 3001:3001; package.json start is `next start -p 3001`).
#
# The tenant is identified by the SUBDOMAIN (left-most label of Host), and the
# subdomain is the tenant's DATABASE NAME (get_db_names does `db = subdomain`).
# So Host must reach the app unchanged.
#
# server_name is a wildcard and DNS is *.punrasargroup.com, so adding a tenant
# needs NO change here and no DNS record - only a con_org_master row with
# con_org_shortname = <db> and active = 1, plus that tenant's database.
#
# Known tenants at time of writing: nbjcl, winsome (winsome not yet registered).
#
# HTTPS: this file is HTTP-only on purpose. `certbot --nginx` rewrites it in
# place, adding the listen 443 block and the redirect. Do not hand-edit those
# lines afterwards or renewal will fight you.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    # Wildcard: DNS sends *.punrasargroup.com here, so any tenant works without
    # an nginx change. Serving an unknown subdomain is safe - the app calls
    # /authRoutes/validate-subdomain and redirects anything unregistered away,
    # so nginx does not need to be the gatekeeper.
    server_name *.punrasargroup.com;

    access_log /var/log/nginx/nbjcl.access.log;
    error_log  /var/log/nginx/nbjcl.error.log;

    # Attachment uploads (bills, employee docs) post through here.
    client_max_body_size 50m;

    # Kept ahead of the proxy so renewals work even if the app is down.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ponytail: no Upgrade/Connection headers. `next start` serves plain
        # HTTP; websockets are a dev-only HMR concern. Add a $connection_upgrade
        # map in conf.d/ if a route ever needs WS or SSE.
        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (:443)
#
# INTERIM: this currently uses a SELF-SIGNED certificate, so browsers show a
# warning. It exists because punrasargroup.com has no public DNS yet, and
# Let's Encrypt cannot validate a domain it cannot resolve.
#
# To switch to a real certificate once DNS resolves publicly:
#   certbot certonly --webroot -w /var/www/html \
#     -d nbjcl.punrasargroup.com -d winsome.punrasargroup.com
# then repoint the two ssl_certificate lines below at
#   /etc/letsencrypt/live/<name>/fullchain.pem and privkey.pem
# Nothing else here changes. Use certonly + webroot rather than `certbot
# --nginx`: --nginx picks a server block by matching server_name, and the
# wildcard below matches several blocks, so it can edit the wrong one.
#
# No HTTP->HTTPS redirect on purpose while the cert is self-signed - forcing
# users onto a certificate their browser distrusts is worse than leaving :80
# working. Add the redirect when the real cert is in place.
# ---------------------------------------------------------------------------
server {
    # `http2` as a listen parameter, not the standalone `http2 on;` directive:
    # this box runs nginx 1.24 and the directive form only exists from 1.25.1.
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.punrasargroup.com;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/nbjcl-ssl.access.log;
    error_log  /var/log/nginx/nbjcl-ssl.error.log;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# Mobile API on :8001
#
# The mobile app calls <tenant>.punrasargroup.com:8001, and the backend derives
# the tenant from the LEFT-MOST LABEL OF Host. Before the two-VPS split the
# frontend and backend shared a machine, so that URL landed on the FastAPI
# container directly. Now the tenant hostname resolves to THIS box while :8001
# lives on the backend VPS, so we forward it.
#
# `proxy_set_header Host $host` is load-bearing: without it nginx would send
# Host: 45.58.59.64:8001 upstream and every mobile request would resolve to the
# wrong tenant (or none). Retargeting the app at nbjclapi.punrasargroup.com:8001
# is NOT an alternative for the same reason - the tenant must stay in the Host.
# ---------------------------------------------------------------------------
server {
    listen      8001;
    listen [::]:8001;
    server_name *.punrasargroup.com;

    access_log /var/log/nginx/nbjcl-mobile.access.log;
    error_log  /var/log/nginx/nbjcl-mobile.error.log;

    client_max_body_size 50m;

    location / {
        proxy_pass http://45.58.59.64:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
