services:
  nbclerp-frontend:
    # No build: stanza on purpose. Only docker-compose.yml is scp'd to the VPS,
    # so a build fallback there can only fail with a confusing "no such file:
    # Dockerfile". CI builds (with the NEXT_PUBLIC_* build-args, which must be
    # set at build time) and pushes; the VPS pulls.
    image: ghcr.io/tarunsadhukhan/nbclerp3ui:latest
    container_name: nbclerp-frontend
    restart: unless-stopped
    # 3001 inside the container: package.json start is "next start -p 3001".
    # Host 3001 too, so nginx for nbcl.infoskyglobalit.in proxies to :3001.
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Kolkata
    networks:
      - nbclerp

networks:
  nbclerp:
    external: true
